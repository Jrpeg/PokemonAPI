<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Card Generator</title>
    <style>
        .card{
           background-color: Bisque;
           display: flex inline;
           border: 4px solid SaddleBrown;
           border-radius: 20px 20px 5px 5px;
           width: 320px;
           height: 450px;
           margin: 25px;
           padding-top: 30px;
           justify-content: space-evenly;
           box-shadow: 5px 10px 15px black;
        }

        .pokeimage{
          background-color: PowderBlue;
          height: 150px;
          width: 200px;
          border: 2px solid DarkGoldenRod;
          border-radius: 20px 20px 5px 5px;
        }

        .pokedata, .pokeid{
          margin: 0px;
          display: center;
          padding: 0px;
          font-family: "Lucida Console", "Courier New", monospace;
        }

        .pokename{
          margin: 0px;
          display: center;
          text-align: center;
        }

        .attackBox{
          display: grid;
          justify-content: space-evenly;
        }
    </style>
</head>
<body style="background-color:gray;">
    <input type="button" value="New Pokemon!" onclick="newPokemon()">

    <ol id="pokecard">
    </ol>

    <script>
        const dex = document.getElementById('pokecard');
        const fullPokeArray = [];
        const pokemon = {};

        // Return 150 Pokemon With Some Stats
        const pokemonGenerate = () => {	
          for(i=1; i < 151; i ++) {  
            const url = `https://pokeapi.co/api/v2/pokemon/${i}`;
              fetch(url)
                .then((res) => {return res.json()})
                  .then((data) => {
                    const pokemonData = {};
                    pokemonData.name = data.name;
                    pokemonData.id = data.id;
                    pokemonData.image = data.sprites.front_default;
                    let pokeArray = [pokemonData.name, pokemonData.id, pokemonData.image]
                    addtoDex(pokeArray)
                    })
        	}
        }

        //Add 150 to Array for working with
        function addtoDex(pokeArray){
          fullPokeArray.push(pokeArray)
          if(fullPokeArray.length > 149){
            generatePokemon()
          }
        }

        //Generate 2 random Pokemon
        function generatePokemon(){
        	for(i = 0; i < 2; i++){
            let	choice = fullPokeArray[Math.floor((Math.random() * 150) + 1)];
            writeToDoc(choice)
            }
        }

        //writes pokemon to page
        function writeToDoc(choice){
        console.log(choice);
        const pokehtml =
                		`<div class="card" id="${choice[0]}">
                			<div><img class="pokeimage" src="${choice[2]}">
                    		<div class="pokedata">
                					<h6 class="pokeid">${choice[1]}: </h6>
                    			<h1 class="pokename">${choice[0].toUpperCase()}</h1>
                    		</div>
                        <b><hr></b>
                        <div class="attackBox">
                        <div>
                        	<input type="button" value="move">
                          <b>Flavour Text</b>
                         </div>
                         <div>
                        	<input type="button" value="move">
                          <b>Flavour Text</b>
                         </div>
                         <div>
                        	<input type="button" value="move">
                         	<b>Flavour Text</b>
                         </div>
                         <div>
                        	<input type="button" value="move">
                          <b>Flavour Text</b>
                         </div>
                        </div> 
                			 </div>
                       
                     </div>`
                dex.innerHTML += pokehtml;
        }

        //Create New Pokemon
        function newPokemon(){
        	dex.innerHTML = "";
          generatePokemon();
        }

        pokemonGenerate()
    </script>
</body>
</html>
